name: Build wheels

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to validate (tag releases always build all)'
        type: choice
        default: all
        options: [all, linux, windows, windows-arm64, macos, windows-runtime]
      runtime_run_id:
        description: 'Existing build run ID (required for windows-runtime only)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

# 连续 PR/main 检查只保留最新提交；标签和手动运行使用独立分组。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # main 只运行快速检查，避免与同一提交的版本标签重复构建。
      build_wheels: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check workflow and SDK setup policies
        run: |
          node --version
          cmake --version
          bash -n tools/setup_linux_gpu.sh
          pip install packaging pytest pytest-asyncio PyYAML
          python -m pytest tests/test_publish_workflows.py tests/test_macos_build_policy.py tests/test_wheel_policy.py tests/test_ci_workflows.py tests/test_linux_gpu_setup.py tests/test_build_cache.py -q

  diagnose_windows_runtime:
    needs: [preflight]
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows-runtime'
    runs-on: windows-2022
    steps:
      - name: Validate runtime diagnostic run ID
        id: runtime_source
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            // 仅运行库诊断要求已有构建 ID；在下载前拒绝空值及非法输入。
            const rawId = process.env.RUNTIME_RUN_ID;
            const runId = Number(rawId);
            if (!/^[1-9][0-9]*$/.test(rawId) || !Number.isSafeInteger(runId)) {
              throw new Error('runtime_run_id is required for windows-runtime and must be a positive integer');
            }
            core.setOutput('run_id', String(runId));
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows-amd64
          path: runtime-check
          run-id: ${{ steps.runtime_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pefile
      - name: Load each bundled DLL without Vulkan SDK
        run: python tools/diagnose_windows_runtime.py runtime-check
      - name: Verify Windows wheel distribution
        run: |
          pip install packaging
          python tools/verify_wheels.py runtime-check --allow-subset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-windows-runtime
          path: runtime-check/*.json

  build_linux_x86_64:
    needs: [preflight]
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/build-cache
        with:
          toolchain: manylinux228
      - uses: actions/cache@v4
        with:
          path: |
            .gpu-tools
          key: gpu-manylinux228-${{ runner.arch }}-vulkan-only-${{ hashFiles('llama-cpp-revision.txt', 'third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/setup_linux_gpu.sh') }}
          restore-keys: gpu-manylinux228-${{ runner.arch }}-vulkan-only-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Linux x86_64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-linux-x86_64
          path: build/ci-wheel-audits/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  build_linux_aarch64:
    needs: [preflight]
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/build-cache
        with:
          toolchain: manylinux228
      - uses: actions/cache@v4
        with:
          path: |
            .gpu-tools
          key: gpu-manylinux228-${{ runner.arch }}-vulkan-only-${{ hashFiles('llama-cpp-revision.txt', 'third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/setup_linux_gpu.sh') }}
          restore-keys: gpu-manylinux228-${{ runner.arch }}-vulkan-only-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Linux aarch64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-linux-aarch64
          path: build/ci-wheel-audits/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: wheelhouse/*.whl

  build_macos:
    needs: [preflight]
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version
      - uses: ./.github/actions/build-cache
        with:
          toolchain: xcode-26.6
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (macOS arm64, Metal)
        run: cibuildwheel --output-dir wheelhouse --archs arm64
      - name: Audit macOS deployment and dependencies
        run: |
          mkdir -p wheel-audits
          for wheel in wheelhouse/*.whl; do
            python tools/verify_macos_wheel.py "$wheel" > "wheel-audits/$(basename "$wheel").json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: audits-macos-arm64
          path: wheel-audits/*.json

  check_macos_older_sdk:
    needs: [preflight]
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version
      - uses: ./.github/actions/build-cache
        with:
          toolchain: xcode-16.4
      - name: Build and check with older SDK
        env:
          CIBW_BUILD: cp312-*
        run: |
          pip install cibuildwheel==4.3.0
          cibuildwheel --output-dir wheelhouse --archs arm64
          python tools/verify_macos_wheel.py wheelhouse/*.whl

  build_windows:
    needs: [preflight]
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/build-cache
        with:
          toolchain: msvc-2022
      - uses: actions/cache@v4
        with:
          path: |
            C:/VulkanSDK
          key: gpu-windows-amd64-vulkan-only-${{ hashFiles('llama-cpp-revision.txt', 'third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/setup_windows_gpu.py', 'tools/download_sdk.py') }}
          restore-keys: gpu-windows-amd64-vulkan-only-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Windows AMD64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs AMD64
      - name: Audit AMD64 wheel architecture and stable ABI
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py wheelhouse --allow-subset
          Get-ChildItem wheelhouse/*.whl | ForEach-Object {
            abi3audit --strict $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-amd64
          path: wheelhouse/*.whl

  build_windows_arm64:
    needs: [preflight]
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'windows-arm64')
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment (ARM64 native)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: ./.github/actions/build-cache
        with:
          toolchain: clang-cl-arm64
      - uses: actions/cache@v4
        with:
          path: C:/VulkanSDK-ARM64
          key: gpu-windows-arm64-vulkan-1.4.350.0-${{ hashFiles('tools/setup_windows_gpu.py', 'tools/windows_pe.py') }}
          restore-keys: gpu-windows-arm64-vulkan-1.4.350.0-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Windows ARM64, CPU+Vulkan)
        # ggml-cpu 的 ARM 实现需要 clang-cl；固定 SDK 的工具与链接库均使用原生 ARM64。
        run: |
          if ("${{ inputs.platform }}" -eq "windows-arm64") {
            # 增量验证只检查新 MODULE 与回退；完整发布仍运行公共 API 回归。
            $env:CIBW_TEST_COMMAND = 'python {project}/tools/windows_vulkan_smoke.py'
          }
          cibuildwheel --output-dir wheelhouse --archs ARM64
      - name: Audit ARM64 wheel architecture and stable ABI
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py wheelhouse --allow-subset
          Get-ChildItem wheelhouse/*.whl | ForEach-Object {
            abi3audit --strict $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm64
          path: wheelhouse/*.whl

  validate_wheels:
    needs:
      - preflight
      - build_linux_x86_64
      - build_linux_aarch64
      - build_macos
      - check_macos_older_sdk
      - build_windows
      - build_windows_arm64
    if: needs.preflight.outputs.build_wheels == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify five stable-ABI wheels
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py dist
          abi3audit --strict dist/*.whl
